openapi: 3.0.3

info:
  title: User API Versioning
  version: 1.0.0
  description: |
    Practice 1 - URI Path Versioning with Flask Blueprint.
    API v1 tra ve full_name.
    API v2 tra ve first_name va last_name.
    API v2 ho tro them chuc nang tao user.

servers:
  - url: http://127.0.0.1:5000
    description: Local Flask server

tags:
  - name: Users v1
    description: API version 1
  - name: Users v2
    description: API version 2

paths:
  /api/v1/users/{uid}:
    get:
      tags:
        - Users v1
      summary: Get user by ID (v1)
      operationId: getUserV1
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/{uid}:
    get:
      tags:
        - Users v2
      summary: Get user by ID (v2)
      operationId: getUserV2
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users:
    post:
      tags:
        - Users v2
      summary: Create a new user (v2)
      operationId: createUserV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    UserV1:
      type: object
      required:
        - id
        - full_name
        - email
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
      example:
        id: 1
        full_name: Van Nguyen
        email: a@vnu.vn

    UserV2:
      type: object
      required:
        - id
        - first_name
        - last_name
        - email
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
      example:
        id: 1
        first_name: Van
        last_name: Nguyen
        email: a@vnu.vn

    CreateUser:
      type: object
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
      example:
        first_name: Son
        last_name: Ngo
        email: son@example.com

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      example:
        error: nf